[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rdlocal"
dynamic = ["version"]
description = "Clean-room regression discontinuity estimation, bandwidths and density test"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Model Zero for Technological Solutions", email = "hello@mzfortech.com" }]
keywords = ["regression discontinuity", "causal inference", "econometrics", "local polynomial", "bias correction", "bandwidth selection", "manipulation test"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/MZ-for-Tech/rdlocal"
Repository = "https://github.com/MZ-for-Tech/rdlocal"
Issues = "https://github.com/MZ-for-Tech/rdlocal/issues"

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.version]
path = "src/rdlocal/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "CLEANROOM.md", "CHANGELOG.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/rdlocal"]

[tool.pytest.ini_options]
markers = ["slow: Monte Carlo tests", "blackbox: compare against reference numbers recorded from rdrobust/rddensity"]
addopts = "-m 'not slow'"
